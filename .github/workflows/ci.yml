name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The bundle ships zero runtime dependencies, so there is nothing to
      # `npm install` — every check runs directly on Node's standard library.

      - name: Validate package & skills
        run: npm run validate

      - name: Env precedence tests
        run: npm test

      - name: Cross-platform smoke (install / uninstall / runtime)
        run: node test/smoke.js
        env:
          # Optional: set these repo secrets to also exercise a live doctor
          # call. When unset, the smoke test skips the network check.
          S8_API_URL: ${{ secrets.S8_API_URL }}
          S8_SESSION_TOKEN: ${{ secrets.S8_SESSION_TOKEN }}
